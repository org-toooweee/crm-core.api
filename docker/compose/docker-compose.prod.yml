services:
  pg:
    ports: []

  pg-admin:
    image: dpage/pgadmin4:9.11.0
    restart: unless-stopped
    env_file:
      - ../../.env.prod
    ports: []
    depends_on:
      - pg
    volumes:
      - pgadmin_data:/var/lib/pgadmin/data

  redis:
    ports: []

  redis-insight:
    ports: []

volumes:
  pgadmin_data: