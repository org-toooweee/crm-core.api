services:
  pg:
    image: postgres:18.1-alpine
    restart: unless-stopped
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6363:6379'

  redis-insight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - '5555:5540'
    volumes:
      - redis-insight:/data

volumes:
  postgres_data:
  redis-insight: